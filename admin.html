<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial; background: #f1f5f9; padding: 20px; }
        .box { background: white; padding: 20px; max-width: 500px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; }
        button { background: #2563eb; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<h2>🔐 Admin Panel</h2>

<form method="POST">
    <input type="text" name="title" placeholder="Notice Title" required>
    <textarea name="description" rows="4" placeholder="Notice Description" required></textarea>
    <button type="submit">Save Notice</button>
</form>

</body>
</html>
