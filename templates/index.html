<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Notice Board</title>

    <script>
        // Auto-refresh every 5 seconds
        setTimeout(() => { location.reload(); }, 5000);
    </script>

    <style>
        body { font-family: Arial; background: #f4f6f8; margin: 0; }
        header { background: #1e3a8a; color: white; padding: 20px; text-align: center; }
        .container { padding: 20px; }
        .notice {
            background: white; border-left: 6px solid #2563eb;
            padding: 15px; margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer { background: #e5e7eb; text-align: center; padding: 10px; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h1>📢 Smart Notice Board</h1>
    <p>College Digital Notice Display</p>
</header>

<div class="container">
    {% for notice in notices %}
    <div class="notice">
        <h3>{{ notice.title }}</h3>
        <p>{{ notice.description }}</p>
    </div>
    {% else %}
    <p>No notices available</p>
    {% endfor %}
</div>

<footer>
    © 2026 Smart Notice Board | ECE Final Year Project
</footer>

</body>
</html>
