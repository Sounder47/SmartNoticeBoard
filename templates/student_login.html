<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Verification - Smart Notice Board</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .login-box { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .icon { font-size: 3rem; margin-bottom: 10px; }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; line-height: 1.4; }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; font-size: 1rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #38bdf8; }

        .error { background: rgba(225, 29, 72, 0.1); color: #fb7185; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; border: 1px solid rgba(225, 29, 72, 0.3); }

        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="icon">🔐</div>
    <h2>Student Verification</h2>
    <p>Please verify your identity to access this secure notice and its attachments.</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" name="name" placeholder="e.g. Your Name" required autocomplete="off">
        </div>

        <div class="form-group">
            <label>Last 2 Digits of Register Number</label>
            <input type="password" name="reg_digits" placeholder="e.g. xx" maxlength="2" pattern="[0-9]{2}" required>
        </div>

        <button type="submit">Unlock Notice</button>
    </form>
</div>

</body>
</html>
